name: Epic
description: A version of a product, or a feature too large for one story
type: Epic
assignees: nmhernandez10
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the epic is, and what shipped means. Name no feature; the sub-issues are the list.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What to know or read first. Empty when nothing is needed.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What was decided out, which no child can say. Empty when nothing was.
