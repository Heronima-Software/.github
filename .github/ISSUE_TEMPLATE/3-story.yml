name: Story
description: Tasks delivered together
type: Story
assignees: nmhernandez10
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What it is for, and what is true once it is done.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What to know or read first. Empty when nothing is needed.
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: One checkbox per item, each starting with Add, Change, Delete or Document.
      value: "- [ ] "
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: What was settled and why, kept current.
